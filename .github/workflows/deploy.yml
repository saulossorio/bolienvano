name: Deploy

# Builds the site for bolienvano.com and pushes the finished files to the
# 'deploy' branch, which is the branch Hostinger serves (Deploy button in
# Hostinger's Git panel). main keeps the Astro source; never edit 'deploy' by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - run: npm run build

      # Stop before publishing if the build is not a complete site
      - name: Check the build
        run: |
          test -f dist/index.html
          test -f dist/contact.php
          test -f dist/.htaccess

      - name: Push dist/ to the deploy branch
        working-directory: dist
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
