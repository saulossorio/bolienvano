name: Deploy

# Publishes bolienvano.com. Hostinger serves the 'main' branch exactly as it is,
# so main holds only the finished site (built files), never the source code.
#
#   redesign    work in progress; every push updates the preview (preview.yml)
#   production  what is live; a push here builds the site and commits it to main
#   main        the built site that Hostinger publishes; never edit it by hand
#
# To publish: merge redesign into production and push. To go back to an earlier
# version: revert the last "Build of ..." commit on main (Hostinger republishes it).
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - run: npm run build

      # Stop before publishing if the build is not a complete site
      - name: Check the build
        run: |
          test -f dist/index.html
          test -f dist/contact.php
          test -f dist/.htaccess
          ! grep -q 'name="robots" content="noindex"' dist/index.html

      - uses: actions/checkout@v7
        with:
          ref: main
          path: site

      # A normal commit on top of main (no force push), so every version stays in history
      - name: Commit the build to main
        working-directory: site
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -q -m "Build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push origin main
