name: Preview

# Publishes the claude-workspace branch to GitHub Pages: https://saulossorio.github.io/bolienvano/
# Preview build: hidden from search engines, no analytics. The contact form
# needs PHP, so it only works on Hostinger, not here.
on:
  push:
    branches: [claude-workspace]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - run: npm run build
        env:
          PUBLIC_PREVIEW: '1'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
